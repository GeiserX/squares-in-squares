version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"
    cooldown:
      default-days: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
